{% extends "layout.html" %}

{% block title %}Apology{% endblock %}

{% block main %}
<div class="container text-center mt-5 pt-5">
    <h1 class="display-1 fw-bold" style="color: #bb86fc; text-shadow: 0 0 20px rgba(153, 50, 204, 0.6);">
        {{ code }}
    </h1>
    <h2 class="display-5 mb-4" style="color: #ffffff;">
        Oops!
    </h2>
    <p class="lead mb-5" style="color: #cccccc; max-width: 600px; margin: 0 auto;">
        {{ message }}
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg px-5">
        Back to Home
    </a>
</div>
{% endblock %}
